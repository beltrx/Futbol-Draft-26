name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build from src
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p public/bundle
          cp dist/assets/app.js public/bundle/app.js
          cp dist/assets/index.css public/bundle/index.css

      - name: Update static bundle in branch (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bundle/app.js public/bundle/index.css
          if ! git diff --staged --quiet; then
            git commit -m "chore: update compiled bundle from src [skip ci]"
            git push || true
          fi

      - name: Prepare static site directory
        run: |
          rm -rf _site
          mkdir -p _site/assets/aistudio _site/public/assets/aistudio _site/public/bundle
          touch _site/.nojekyll
          cp dist/assets/app.js _site/assets/app.js
          cp dist/assets/index.css _site/assets/index.css
          cp dist/assets/app.js _site/public/bundle/app.js
          cp dist/assets/index.css _site/public/bundle/index.css
          if [ -d public/assets/aistudio ]; then
            cp -r public/assets/aistudio/* _site/assets/aistudio/ 2>/dev/null || true
            cp -r public/assets/aistudio/* _site/public/assets/aistudio/ 2>/dev/null || true
          fi
          node -e '
            const fs = require("fs");
            const v = Date.now();
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(
              `<script type="module" src="/src/main.tsx"></script>`,
              `<link rel="stylesheet" href="./assets/index.css?v=${v}" />\n    <script type="module" src="./assets/app.js?v=${v}"></script>`
            );
            fs.writeFileSync("_site/index.html", html, "utf8");
          '
          ls -la _site _site/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
